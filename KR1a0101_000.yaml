body:
  text: 讀易紀聞易類提要臣等謹案讀易紀聞六卷明張獻翼撰獻翼字幼于崑山人後更名敉此其早年讀書上方山中所著也獻翼放誕不羈言行詭異卒以沈湎野宿遇盜隕身其人殆有狂易之疾而其説易乃平正通達篤實不支祧莊老之元虛闡程朱之義理凡吉凶悔吝進退存亡足為人事之鑒者多所發明得聖人示戒之旨揆諸素履所謂能言而不能行者歟朱彞尊經義考載獻翼易注凡五種惟讀易韻考存其讀易約説三卷易雜説二卷讀易臆説二卷及此書六卷均注曰未見今搜採遺編惟得讀易韻考及此書韻考紕漏殊甚如盲談黑白聾辨宫商已别為存目此書不載經文但逐節拈説有如劄記之體其言足采固不至以其人廢矣乾隆四十五年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:60b7318b73045b11a7ac78cc2916885d3ffcf3041e9c40440dc03ccba45d2511
