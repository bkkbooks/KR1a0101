body:
  text: 讀易紀聞卷一明張獻翼撰乾潛龍勿用則欲君子之難進履霜堅氷則防小人之易長勿者禁之之辭至者危之之辭既曰潛矣雖欲用之於何用之或曰舜窮而在下未嘗欲自用孔子窮而在下未嘗欲勿用何也曰治則聖體其常亂則聖通其變舜孔子易地則皆然初九在下君德之隱故曰潛龍九二居中君德之章故曰見龍田者象聖人應世之迹爾龍豈真在是哉三下卦之終故諸爻多於三言終夕亦三象日之終也下乾終而上乾繼之故曰乾乾夕者暮夜宴安之時惕若戒懼之心見於容也初與二既皆稱龍四雖不稱龍即上文知其為龍也猶大壯九三羝羊觸藩九四不言羊知藩決不羸即羊也淵者龍之所安也九五者位之極中正者得時之極在者位乎天位也當其在田天下猶利見之而况在天乎二居下體之中本只是中然中則無不正矣蓋以九居二原非正也但純陽之爻與他卦不同故獨曰中正云他卦九三本義皆直用過剛字此因純乾之爻故謂之重剛以見其剛之不息云耳至若不中也居下之上也皆以九三所遭時位言若武王崩成王幼王室未安殷民未固正不中不好時節周公攝天子事非居下之上乎以其重剛不息故能終日乾乾夕惕若如此即思兼待旦之意九四之與九三位若同而異情若異而同九三居下之上而方尊九四居上之下而己逼故位若同而異九三之惕則懼於進九四之躍則向於進四之躍其情固異乎三之惕也四爻為太子之位懦於躍則為漢之惠元躁於躍則為商臣或曰晉之申生漢之榮疆非以躍而咎也曰易之戒義也三子之遭命也至泰伯仲雍伯夷叔齊則躍與否無咎與否皆所不能囿也德而不位仲尼以之虛天下之望也位而不德癸辛以之失天下之望也德與位並二帝三王以之慰天下之望也居君位而又上焉將何之乎此益戒舜以罔淫於樂禹戒舜以無若丹朱傲之時也若志與位俱亢梁武帝唐明皇晚年是己用者謀慮裁處以行之之謂九六天道用九用六人道易為人作故言用洪範九用亦此義乾見羣龍以知言坤利永貞以行言乾主知坤主行也六十四卦於此發其凡剛過則競故欲後而不先柔過則邪故欲正而能久乾者萬物之始對坤而言天地之道也元者萬物之始對亨利貞而言四時之序也資始與資之深資於事父以事君皆訓取字統天言乾之體御天言乾之用統如身之統四體御如心之御五官利者物之遂方是六七分到貞處方是十分成孔子雖是釋文王卦辭然多自發明己意如體德象變與才皆卦辭所未發者皆於彖傳釋之故卦之名義至彖傳為始備元為稟氣之始未可區别故總謂之萬亨則流動形見各有區别故特謂之品雲行雨施亨之見乎氣也品物流形亨之見乎形也終謂下乾之終九三是也始謂上乾之始九四是也一乾方終一乾又始則生意於此續而不絶故不曰始終而曰終始説卦終萬物始萬物亦此意六位言六畫之定分六龍言六爻之變象六位乃諸爻之所同六龍則純乾之所獨聖人法乾道之終始而為六位之時成六位之時成即以寓乾道之終始乘龍御天則天道元亨利貞皆其所運用設施非專行其元亨而已萬國咸寧亦兼有始亨遂成之意八卦之象廣矣聖人舉其大者天行以氣言主動地勢以形言主靜卦下象解一卦之象爻下象解一爻之象自強者體乾之象不息者體重乾之象乾坤不言重異於六子也稱健不稱乾異於坤也象皆孔子所自取文王周公所未嘗有與卦爻之詞絶不相關卦爻有吉有凶大象無有不吉其間一以字示用易之法言君子大人先王或言后言上見易非小人所得用也運行不窮之謂健進而不息之謂強象在彖後者彖詳而象略也小象於乾曰陽在下於坤曰隂始凝隂陽之稱始此以六十四卦隂陽之初爻即太極所生兩儀之一以為諸卦通例九二在下云德施普者如日方升雖未中央其光已無不被矣小象提出一德字見二所謂大人者以德言非以位言也陽在下者陽氣潛伏而未出於地德施普者陽氣著見而普及於物二之施以德言五之造兼德與位言有其德無其位不敢作禮樂即所謂造也四爻辭但云或躍無咎夫子加進字以斷其疑盈謂極陽不可久謂隂生以盈釋亢字不可久釋有悔字人知其不可久而防於未亢之先則有悔者無悔矣乾者萬物之首非有心首萬物也雖為首而實未嘗為首老子曰後其身而身先迹雖不為首心實為首可見老易公私之辨德在此位在彼初九以陽德在下潛德非為我九二以陽德而出施普非兼愛九三知有此而不知有彼故反復於道而不敢離九四知有此而不知有彼故旋觀無咎而後敢進五不以得位為樂而志在大有為上以處高為悔而戒其不可久蓋乾之德不可為首故也知乾德不可為首則惟六位所遭而處之焉往而不裕君子體仁是以仁為體以仁為體則一以我體仁則二夫利和義者善也其害義者不善也世人多謂疏通者能幹事不知疏通者雖能取辦目前然不貞不固終必敗事惟貞固者為能幹事也元亨利貞釋彖分而二之一隂一陽之謂也文言分而四之四時五行之謂也君子行此四德是一之也非二之也體仁則嘉會利物貞固一以貫之釋爻辭之文言惟乾坤二卦為詳至於餘卦見於繫辭傳者如鳴鶴在隂之類所釋者諸卦十八爻而已初九以世從道不以道從世以實晦名不以實顯名內樂存故不有行於時必有行於己所謂遁世無悶樂則行之也外憂亡故不見知於人必見知於天所謂不見是而無悶憂則違之也遁世無悶二句比不易乎世二句為深一節樂則行之二句比遁世無悶二句又深一節論龍德之隱必至是而後盡違者去而不以道殉人也潛見飛躍只是一體雖極於五而非有少加於初雖居於初而非有少詘於五然非有確乎不拔之潛必無聖作物覩之化庸言冝無事於信矣而亦信焉庸行冝無事於謹矣而亦謹焉謹信如此冝無事於間邪矣猶間邪以存其誠恐其發於言行者猶有不信不謹也夫如是既善於世矣然猶不自以為善而或自伐也其所以庸信庸謹而間邪存誠者猶欿然若不足也初之隱二之正中人所同有皆重在龍德上庸信庸謹造次必於是也邪自外入故間之誠自我有故存之誠然後我真與天地萬物同為一體然後為體元為窮理盡性至命為天德為龍德為君德然後先天不違後天奉時如此乎大人之學不可自小也終日乾乾必有事焉無事而勤徒勤也勤於進修則非徒勤矣然進修必有地德業必有物忠信辭誠所以指其地實其物也知至能至知終能終聖知之學就矣是以高而不泰卑而不戚也知至至之致知也求知所至而後至之知之為先故可與幾所謂始條理者知之事也知終終之力行也既知所終則力進而終之守之在後故可與存義所謂終條理者聖之事也上句則以知至為重而至之為輕下句則以知終為輕而終之為重能知此幾則進退存亡皆先知之能終守此幾則進退存亡皆不失其正此幾之所在天地造化之體用皆統焉大人之所以合德合明合序合吉凶者此知此幾耳曰至曰幾皆進字意曰終曰存皆居字意以下體言則三居上畫故曰上位以二體言則三在下卦故曰下位三四皆以進修言者重剛不中皆危疑之時也恆猶常也以上進為常則其志邪以下退為常則其德孤九五只是釋利見二字蓋大人之所以為大人者已釋於九二間邪存誠德博而化五之飛龍在天則至誠之變化者也各從者一物親一物而已至於聖作物覩無一物不親者何也聖人者三才之宗主萬物之天地所謂出乎其類者故統乎萬類萬物覩聖人即利見大人六龍之首故曰貴曰高非君非臣故曰無位純陽無隂故曰無民自四而下皆從九五故曰無輔如是而動其誰與我上九既已無民則喪亡至矣豈但有悔而已哉聞之黃尚書懋明曰此三無字乃上九自無之也蓋既謂之貴自是居有位者但以其志滿不能小心以愼有位故曰無位耳既位之高自是統有民者但以其志滿不能巽志以體下民故曰無民耳既謂之賢人在下位則自是為我輔者但以其志滿不能虛已以用賢人雖有位若無輔耳皆亢意也爻辭但言有悔而夫子以動釋之吉凶悔吝生乎動者也陽在下也陽以氣言下也以人言孔子釋潛曰隱曰下曰藏隨事制義無不可也象傳反復其道主在道理上説行事主在事任上説夫道不容違故終日乾乾以重復踐行乎斯道事不容諉故終日乾乾以行吾當行之事要之行事者即其道行之於事也天下文明以文明之運言之乾道乃革亦以天運言與時偕行須説得斟酌蓋無時而不謹者君子守身之常因時而加謹者君子處危之道文謂物之鮮榮明謂化之光顯時行則偕行可也時極則偕極是為不知變時隱則隱故初九當退而安於潛藏之幽時顯則顯故九二當見而著其文明之治天之健終日而不息九三之進修亦與之不息故曰與時偕行龍之在淵革潛而為躍九四之上進亦革卑而居尊故曰乾道乃革以龍德宅天位則德不儉於位以天位處龍德則位不儉於德故曰位乎天德天時之極者暑極不生暑而生寒君位之極者治極不生治而生亂故曰與時偕極天不為首天之則也君不為首帝之則也故曰乃見天則初曰德之隱二曰德之中三四皆曰進德五曰位乎天德上不言德者過中非德也文言釋六爻凡三節第一節似以德言上爻又似説位第二節初似説位二似説時位三以上又似説用第三節却全似説時亦略有分别聞之孔頴逹云潛龍勿用下也一節以人事明之陽氣潛藏一節以天道明之釋彖曰性命此則曰性情言性而不言命非知性之本言性而不言情非知性之用彖言元亨利貞屬之乾文言以屬之君子乾之德固在君子躬行中也彖傳言雲行雨施屬之乾文言以屬之聖人乾之功用在聖人發用內也止言利而不言所利其利大而不容止一事也若曰利建侯利女貞利涉大川皆言所利者也大哉乾乎只是一箇乾只是一箇四德何處是剛健又何處是中正又何處是純粹精蓋乾德只是一樣但贊美之詞有不能一二字盡者故首以剛健贊之見其猶未足也更著中正字猶以中正未盡也更著純與粹字又更著精字反覆贊咏不能自己也非聖人知天地之化而與默契無間亦説不到此剛健中正純粹精只在四德上見剛言四德之運到此時便始亨到此時便遂成初不容阻撓健則年年此始亨遂成亘古亘今此始亨遂成不容停息者也中言元亨恰好這些氣候利貞恰好這些氣候此無太過彼無不及正則元亨行始亨事利貞行遂成事此無侵於彼彼不犯於此純是純一不雜如七分醖釀始物之氣却有三分隂柔不始之氣雜之便不純矣惟乾則元之時純是一段始物之氣用事利之時純是一段利物之氣用事至利貞莫不然更無一毫隂柔之氣雜乎其間焉粹是粹美無惡如元本沖和之氣始物矣若稍有一毫厲氣雜之便欠粹矣惟乾則元始之氣極其沖和休美至亨利貞皆極其沖和休美更無一毫邪惡之氣雜乎其間焉精者元始亨通利遂貞成皆維天之命至微至妙上天之載無聲無臭有不可以粗迹形容者又聞之楊萬里氏曰曷謂純粹精請以金喻不雜者金之純不雜而良者金之粹良而百鍊者金之精精者不雜之至故夫正者道之純粹也精則未也中者道之精也蓋正猶有偏也楚燕南北之正也非中也洛師天地之中也夷惠吾道之正也非中也孔子吾道之中也正者中在其外中則正在其中乾陽故剛健陽居二故正陽居五故中六爻純陽故純粹精聖人在下雖已顯而未得位則進德修業而已學聚問辨進德也寬居仁行修業也君德已著利見大人而進以行之耳乾之道不盡於九二故有學問之功坤之道盛於六二故不習無不利心大則百物皆通心小則百物皆病必寬以居之則吾之所以學聚問辨者常見其與心為一矣學以取善故衆善集問以明善故一不善不入聞之虞翻曰以乾接乾故重剛位非二五故不中然憂所當憂卒於無憂疑所當疑卒於無疑此二爻所以皆無咎上不在天者非居天子之位而攝天子之事為天下所疑忌者也下不在田者非居羣僚之位而總羣僚之上為天下所瞻仰者也天地合德四句就大人二字極言之先天弗違以下就利見二字極言之此大人以在天之大人言所謂合德合明合序合吉凶即其上治之功如此先天後天內都包有了下面抽出重在弗違上去耳非合德之外又另有先天後天之功也一云存之為天德故曰先天動之為天道故曰後天非兩事也天不違固見天之從之奉天時亦見天與之應天地之德元盡之矣元氣之成象為日月元氣之運行為四時元氣之變化為鬼神元氣之虛靈在人者為心一也大人之合明合序合吉凶總只是與天地合德故曰人者天地之心天地以全體言鬼神則各有所司存如風雲雷雨社稷山川之類皆鬼神所在鬼神言其功用天地言其主宰覆載無私之謂德照臨無私之謂明生息無私之謂序禍福無私之謂吉凶九二大人於道不容不用力至此則以道為體無所容力矣進退者身也存亡者位也得喪者物也此爻窮上反下則退矣九變為六則亡矣無民無輔則喪矣潛之為言言君子者再必君子而後能安於潛也亢之為言言聖人者再必聖人而後不至於亢也不言得喪者知進退存亡則無得喪矣上九亢矣病也亢而不知焉病之病也知之斯能處之故亢者不知喪亡之幾而不知退者也聖人唯能知之故能不失其正以處之又何亢之有坤物之牝者皆能順陽而行求其從一不變莫牝馬若也馬象乾而坤言牝馬明其為乾之配元亨利牝馬之貞已盡坤之全體君子以下則申占辭曰後得曰得朋利也牝馬之貞故也曰先迷曰喪朋不利也非牝馬之貞故也迷猶迷途得猶得路先迷後得主利是一意明於臣子之大義毋敢專制也得朋喪朋又是一意安於臣子之大分毋敢踰越也合之總是順於君父文王彖詞鮮有舉君子以歸責者惟坤則曰君子有攸往蓋道自乾而坤則屬之人矣屬之人故責之人者於是乎始乾貞欲剛故天尊坤貞欲柔故地卑聞之淮海易談云先則迷先乾也後則順後乾也失道失坤道也得常得坤常也喪朋先迷也得朋後順也利其後順之利吉其得常之吉坤之辭言無疆者三無疆者天道也厚則可以合天道順則可以行天道貞則可以應天道觀此三言坤元之承天見矣乾言不息其至久之德邪坤言無疆其至大之業邪坤未嘗不健但其健也以順為健然則無剛德者柔其所柔豈坤之柔無方德者靜其所靜豈坤之靜故君子法坤不當於柔靜而當於剛方能剛方然後有常然後化光然後時行故曰坤之用皆乾之用以含𢎞光大四者形容坤道猶乾之剛健中正純粹也臣道一於順故欲柔欲靜不順則為莽卓臣節病於順故欲剛欲方順則為張禹胡廣坤何以動而剛曰發生必達中順二者爻辭皆就見於外言象傳則以二者之見於外皆根於中而發至文言却以中在中順在外其立言不同中順二者非有二項道理所謂中者要即順之純粹而精美耳如文王之徽柔懿恭柔與恭即此之順徽與懿即此之中故單言中即順之得其中單言順即以中道為順乾之初九陽始萌坤之初六隂始生陽始萌則曰潛龍勿用言方隱而未可以進也隂始生則曰履霜堅氷至言雖微而必至於盛也觀二爻之辭可以知君子之難進而小人之易盛矣履霜而知堅氷之將至羸豕而知蹢躅之有孚姤之一隂即坤之初隂也馴謂習習而至於盛習因循也乾五爻皆取象惟九三獨指其性體剛健者言之坤五爻各取象惟六二獨指其性體柔順者言之乾九四陽居隂坤六三隂居陽故皆曰或三多凶故於乾坤之第三爻辭又獨詳焉言為臣處下之道不當有其功善必含晦其美乃正而可常然義所當為者則以時而發非含藏終不為也含而不為不盡忠者也夫子懼其人之守文而不達義又從而明之惟其知之光大故能含晦淺暗之人有善惟恐人之不知豈能含章光謂見得明大謂見得大他處光大每以光為知大為度此曰知光大皆以知言含章曰可貞可貞方能時發未有不能含章而能守貞者未有不能守正而能時發者譽者咎之招也六四之所以無咎者以其無譽也坤卦六爻初上二爻言隂道之消長中四爻言臣道之顯晦初隂之微忌其長也上隂之極著其窮也二言其德之盛五言其業之美乾者剛健中正之卦九五者剛健中正之爻坤者柔順中正之卦六二者柔順中正之爻蓋惟其柔順中正故為直方且大惟其得坤道之純故不習無不利也含則有時而發括則無時而出矣乾皆取龍為象坤不一而足陽純而隂雜也陽先於隂而陽之極不為首隂小於陽而隂之極以大終龍戰者可疑難辨之辭血玄黃者依然分定之義謂戰似兩龍視其血則一非龍也趙高篡秦秦亡而高亦誅王莽篡漢漢微而莽亦敗以坤馬之僣龍而戰夫乾之真龍也野謂進至於外取隂勢泛漫散溢無復限制之意黃裳乃黃的裳即其裳乃黃色也中順乃中的順即其順皆中道也或曰用九用六乾坤七爻妄也有位斯有爻位止於六爻有七乎用九用六不特乾坤之變化學者氣質之變化亦以之氣質偏於剛以柔變化之用九之義偏於柔以剛變化之用六之義乾極於九則亢而有悔坤極於六則戰而必傷天地尚不可過而况於人乎文言釋履霜因言積不善以積善配釋括囊因言賢人隱以草木蕃配配則相形而其理自别此文言所以為文之格也積善餘慶之慶即乃終有慶之慶子安於正以從父臣安於正以從君不安於正不能有慶不早辨他直到不可反方却辨剗地激成事來善可積也不善不可積也弒逆國家之大禍聖人不忍言臣子不忍聞也探其初亦止於萌一小不善之心而積之傳曰有無君之心而後動於惡故一小不善之心在下者不可不察之於己在上者不可不察之於人辨察也察之早勿使之漸則國之禍不作矣敬即義之在內者義即敬之在外者有言敬不必言義者如修已以敬有言義不必言敬者如集義所生敬義是一事內外是一道體用合而德不偏故敬義立而德不孤也立謂並立不孤謂不偏偏於內只敬而無義則做事出來必錯了偏於外只義而無敬則無本何以為義皆是孤也須是敬義立方不孤敬義立而德不孤即解大字乾九三言誠坤六三言敬誠敬者乾坤之别乾九二言仁坤六二言義仁義者隂陽之别易卦惟乾坤兩卦論學最多乾坤兩卦論學惟九二六二最精天地之間萬物燦然而陳者皆隂麗於陽其美外見者也六三六五皆以隂居陽故三則曰隂雖有美五則曰美在其中然三方進而位不中故雖有美而尚含之五正位而居體故美在其中而發於事業初六首言人之善不善末斷之曰蓋言慎也六四首言天地之交不交末斷之曰蓋言謹也初當謹審毋縱夫微隂之長四當謹審毋衒於重隂之時六五當與六二並看故皆以君子言蓋直內方外之君子即黃中通理之君子也為臣之道有大美而不能含藴者矜也有大美而不從王事者吝也從王事而自有成功者驕也禹之不矜伐周公之不驕吝得六三之義變化即董仲舒所謂聖人在上隂陽調風雨時者也如洪範所謂恆即非變化矣閉即所謂政多紕繆則隂陽不調之謂也或恆於陽而不交於隂或恆於隂而不交於陽此龔勝所以不仕於莽之朝蔡雍所以失節於卓之官也天地之雜皆言隂之似陽臣之似君上六當與六三並看故皆揭以隂之一字三曰隂有美含之猶知有陽也上曰隂疑於陽則與陽均敵而無小大之差矣在君父則冝早辨也不曰馬與龍戰而曰龍戰者不沒其僣也不沒其僣所以深誅其僣也龍之類有血血之類有色故曰未離其類屯時屯求亨其道有三惟至正為能正天下之不正故曰利貞惟不欲速為能成功之速故曰勿用有攸往惟多助為能克寡助故曰利建侯辭曰勿用有攸往戒於遽也詩稱武王曰於鑠王師遵養時晦夫商末周初正屯之日也而武王云爾謂非戒於遽者哉漢高帝平秦項之亂除秦苛法為義帝發喪得屯之利貞不王之關中而王之蜀漢隱忍就國而不敢校得屯之勿用有攸往會固陵而諸侯不至亟捐齊梁以王信越得屯之利建侯彖言世變之屯象則自言人道之常經者立其規模綸者紏合而成之亦有艱難之象焉經以象雷之振綸以象雲之合坎在上為雲故雲雷屯坎在下為雨故雷雨作解雲而未雨所以為屯衛君待子而為政必先正名此便是經綸處易只有三處言利建侯屯兩言之豫一言之屯之初非不正也而二近之則為寇旅之上非不凶也而五承之則有譽命屯如以時言塞而未遽通也邅如以遇屯之時言回而未遽進也屯者隂陽之始交二與四隂居隂初與五陽居陽二應五四應初故皆曰婚媾取隂陽之始交也屯四隂爻二四上皆言乘馬三獨言即鹿者才位皆柔不能進者故有乘馬班如之象爻柔位剛躁於進者故有即鹿無虞之象易言不如舍辨之審也傳言舍之去之決也凡飛走可擒獲者皆謂之禽周禮云羔豚犢麋雉雁謂之六禽六爻惟二五言屯二在下而柔五剛而陷於柔皆非濟屯之才屯如時之屯也屯其膏五自屯之也爻言班如者三二班如待五應也四班如待初應也上班如獨無所待進又無所之憂懼而已利建侯凡卦爻辭重見者茍有其義則不别辭不必皆有象也女子之云乃是假象古人詩賦凡意關君臣往往托為夫婦之辭正猶此也乘馬欲行也欲從正應而復班如不能進也下馬為班與馬異處也小貞者且即近事以漸料理使各得其正也此於見在分位力量猶可為也故吉大貞者遽於大事一舉匡釐欲盡反於正也此以時勢度之未可便有所為也故凶坎體象水故取膏澤之義何可長詩人苕華之比身際衰周如苕附物雖榮不久聖人取其早辨録居小雅之末若趙良對商君有朝露之比張彖論楊國忠有氷山之比蒙屯者物之初非物之厄蒙者人之初非性之昧勾而未舒曰屯稚而未達曰蒙故蒙有亨之理果昧也奚亨焉教者無求於學者然後先王之道尊學者有求於教者然後教者之言入故無求非傲有求非詘未達而求達者一問答而加多不達而求其達者百問答而加少初筮而告達其蒙也再三而不告亦達其蒙也一告而達則悅再三而不告則憤安知憤者之達不深於悅者乎從草作蒙乃草長掩物也小篆從豕亦無知意會意凡為蒙覆之意又借為相承之義初筮告瀆則不告者何以言其不告也誠意專一而筮則神之告之卦辭爻辭應合所問如占婚姻與之咸恆曰納婦吉曰勿用取女曰歸妹征凶占征伐曰利用侵伐曰在師中吉曰不利行師曰勿用師占田獵曰田獲三狐曰田獲三品曰即鹿無虞曰田無禽若此者皆所謂告也若夫卦辭爻辭不應所占之事此則誠意不至所謂不告也瀆之為言褻也再三問者褻也再三告者亦褻也童蒙求我猶是執贄摳衣來及門耳至於初筮方是考德問業有所叩請若又再三筮則是以初所值者為未足憑而有疑二之心矣初筮告者當其可之謂時瀆則不告者不凌節而施之謂遜初與再三就蒙者之疑與不疑説不就蒙者問我之多寡説泉方出山而未達如人方在稚而莫適也初出之泉潛伏未見亡所汚滑未發之蒙藴蓄在內亡所誘化德者行之自出行者德之所形泉不可禦君子得之以果其行泉不可測君子得之以育其德伊尹作三風十愆曰具訓於蒙士夫訓蒙一語肇於尹而發蒙等語續於周發蒙者貴有包蒙之量包蒙者貴有發蒙之政瀆蒙則失言擊蒙則失蒙小象於屯之初九隂陽以貴賤别於蒙之六四隂陽以虛實分包蒙包上下四隂也納婦納六五一隂也包與納二虛能受之象克九剛能任之象一六五也性隂有蒙象隂應陽有婦象位尊有父象剛柔有上下之分故屯二之於初惡其乘剛柔有往來之情故蒙二之於五喜其接諸爻皆蒙其不蒙者惟二剛二以剛居中包蒙以開其善上以剛過中擊蒙以懲其惡上下四隂爻皆因二以起義五應二則為童蒙之吉初承二則為發蒙之利四逺二不明者也則為困蒙之吝三乘二不順者也不以蒙待之故不言蒙陽明隂暗上明下暗以隂居下是兩重暗故曰蒙之甚在發蒙非實有桎梏取其拘禁過甚之意耳婦羣蒙尊教者也子九二尊受教者也學者才識有高下入道有難易故包之婦謂柔順者納之如孔子取狷者童受聖教如子事父也一爻而三善具矣見謂所見在於此也金夫多金之夫所謂蒙者動以利則身非其身失其身則利非其利陳相下喬而入幽公孫曲學以阿世斯女不可取也斯士獨可用乎是有教無類之中又得取善去惡之道窒於通之謂困嗇於復之謂吝吝疾者諱醫吝過者諱師有童稚之蒙有小民之蒙有學者之蒙有聖人之蒙六五秉巽順之德自居於童稚之蒙以下學九二剛明之賢此聖人之蒙也聰明睿知守之以愚高宗自以其德弗類學於傅説武王自以不知彛倫訪於箕子所謂蒙以養正聖功者也蒙至於擊則繼之以怒矣教其未裕乎蓋包者容其發之所不迪擊者攻其包之所已窮發之之蚤而包之之極然猶蒙而不化以至於擊教之誠有如王制所云不變者斯擊之矣讀易之屯知君道讀易之蒙知師道有天地則有君師此屯蒙所以次乾坤也乾坤既位人居其中屯以建侯作之君蒙以養正作之師爻辭曰子克家以九二之才言象傳曰剛柔接以九二之得伸其才言彖傳志應象傳剛柔接都重在五之應二三以啓蒙為時用女子只是假象象傳之意言勿用取女者以此女行不慎故勿用取夫子據象為傳而蒙意自見於言表需傳曰需事之下又曰需事之賊易之需非不決之需見險而未可動能動而能不動者也孚者以誠待詐詐窮而誠自逹貞者以正待邪邪詘而正自伸雖大川亦可涉而利也凡乾在下者必當下復今欲上復前遇坎險未可直進宜需待之需之義有二有需於人者初二三四上是也有為人所需者五是也凡五皆天位屯不足言特於需發其義乾在坎下為需剛健而不陷故利涉大川乾在坎上為訟健無所施故不利涉大川升而未降則天下望雲而徯雨藴而未施則君子藏器以待時待時者夫何為哉飲食以自養宴樂以自怡而已此顔子簞瓢陋巷之日謝安遊宴東山之時也雲上于天之需自是人需之大抵飲食只謂日用飲食以見其如常耳宴樂即其飲食如常處見其宴間安樂也要知此飲食與九五需于酒食不同九五酒食假象也大象無假象之例故此飲食宴樂實謂飲食如常宴間安樂也惟有德之君子能之不然含哺之民皆顔酒荒之士皆謝矣國外曰郊同人以象上九此以象初皆取其逺同人于門于宗而後于郊近而逺也需于郊而後于沙于泥逺而近也初最逺坎利用恆乃無咎九二漸近坎小有言矣終吉者初九以剛居剛恐其躁急故雖遠險猶有戒辭九二以剛居柔性寬而得中故雖近險不害其為吉近則有言迫則致寇其勢然也凡患難之辭大小有殊小者至於有言言語之傷至小者也需與漸皆取有所待而進之義需內卦於郊於沙於泥由平原而水際水際非人所安也漸內卦於干於磐於陸由水際而平原平原非漸所安也皆以三危地故也需之三遇坎而曰致寇至漸之三互坎而曰禦寇禦寇者艮剛而能止致寇者乾剛而不中也致之為言罪在三矣問敬慎之别曰敬字大慎字小如人行路一直任地去便是敬前面險處防有顛躓便是慎慎是惟恐有失之意三能敬則雖迫坎之險而不敗四能順則雖陷坎之險而可出敬與順固處險之道也需于郊者險地尚逺人所必不避也而避焉以剛而能守也需于血者險難迫切人所必不安也而安焉以柔而不競也九三為內卦之上而敬慎不敗上六為外卦之上而敬之終吉內外三爻之需一於敬矣自陽呼隂曰寇自隂稱陽曰客四外卦之初出尚有可之之所上外卦之終出無可之矣故入而藏出逃其巢穴所以避陽而去入伏其巢穴所以避陽而來上不言需者時既終無復有需矣需初九九五之吉固不待言至餘四爻雖時有悔吝然終歸於吉初上二爻皆無位二士三鄉大夫四大臣五君位乾上九貴而無位需上六不當位乃爵位之位非隂陽之位或問剛者能需六四是柔何以亦能需曰六四柔而得正者也剛之能需猶乾之健而知險柔而得正者之能需猶坤之順而知阻順之至亦自有健在故剛柔同歸於能需或者疑六四既于血矣又何需之有不知六四若不是能需則便死了又安能出自穴大抵凡人落在難中若能韜晦寧耐亦自有可出之時豈謂一傷便無生望上六原只是敬而順之殊非因不能禦而後順也初之恆二之衍三之敬四之順五之貞六之敬此六者所以需也訟需訟皆以坎之中實為主特需之坎在上為光為亨訟之坎在下為窒為惕窒惕者光亨之反訟者爭之尤也中者不偏於己無過於爭也曲直未明故窒勝負未明故惕中吉虞芮之相遜是也終凶雍之納賂而蔽罪邢侯是也訟之吉者四凶者一利不利亦各一曰吉曰利非勸訟也皆止訟也名卦之義自卦德上剛下險險而健取乃不好底訟文王繫辭又就卦體卦變卦象取出來垂戒於人以見訟非好事不可徒以上剛下險險而健兩相角持而輒爭辨須是不得己乃訟而訟又得中可也大川乃險陷深昧不測之所在人事則刑法深昧乃不可知之地也卦辭有孚窒是提一頭中也終也見大人涉大川俱為有孚窒者示戒剛自上而反下為來柔自下而升上為往為進剛來而得中此卦變也易中言卦變始於此書吕刑云咸庶中正則中正者聽訟之道也虞芮爭田之訟必欲見文王故其訟之理決鼠牙雀角之誠偽必欲見召伯故其訟之理明為聽訟之大人者不尚中正可乎天上水下勢自不接而違訟之象也人之情不相合則暌訟之由也天為三才之始水為五行之始故君子法之作事謀始期不至於相違而已凡事有始有終訟中吉終凶然能謀於其始則訟端既絶中與終不必言矣君子必自訟自訟者訟心也訟心者祥訟人者殃爻上自五君位外上不足言初三四吉二僅無眚者以犯分於先不克而後逋竄非本無訟上之心也二爻上兩句皆是爻辭下兩句方是象傳如需之上六象傳句法初三兩柔爻皆係以終吉知柔而不喜訟者終吉則知剛而好訟者終凶矣坤六三雖無成而有終但不敢為倡而已訟六三止云無成則始終皆無矣王事即訟事無成即彖之訟不可成食舊德與位乎天德語同食必稱德而食二與五訟四與初訟其與為敵者強弱不同皆曰不克者蓋二以下訟上其不克者勢也四以上訟下其不克者理也二見勢之不可敵故歸而逋竄四知理之不可渝故復而即命二四皆剛居柔故能如此否九四有命指氣言此有命指理言皆上乾故皆曰命歸者反而安其分之小渝者變而安於理之正在下皆無訟此九五所以於訟為元吉也初六上九不能無訟明矣初不言訟杜其始也上不言訟要其終也初不永所事三守舊居上九雖有鞶帶之錫而不免終朝之三禠首尾皆不可成之意不謀其始訟之禍何如哉謂之所事則亦訟乎公庭矣曰不永猶未説到完結也辨明而吉方是事結永其訟則不勝而禍難及矣逋者避為敵之地也三百戶邑之至小者若處強大是猶敵也能無眚乎羔裘詩云舍命不渝大雅詩云敬天之渝皆訓變訟非善事四捨其不善以復於善蓋無訟才而有訟心亦非也五凡有孚而見窒者皆來訟之非無理而訟也易中以中正之類須是隨卦體認如此中正本義訓之云聽不偏斷合理學者得是法焉可以説易矣象傳亦不足敬姑未及其三褫只據終訟得勝而論之亦猶益上九象曰莫益之偏辭也故楊惲告霍氏息夫躬告東平初以此而侯卒以此而誅師師也者授民以器之凶而納民於事之危為民禦寇為中國攘狄為天下除殘去兵若黃髮之尚父元老之方叔足以當丈人矣亷頗趙充國李靖抑其次也王翦馬援王元謨則年焉而已矣然則用將必年則周瑜謝玄可廢歟曰何可廢也然必曰丈人何也將者國之司命必曰丈人謹之至也吉謂必克無咎謂合義蓋有吉而有咎者有無咎而不吉者吉且無咎乃盡善也知師貴正則看武經七書有所取裁知師貴丈人則看百將傳有所權度衆正可王贊六五剛中而應贊九二行險而順贊兩體剛中而應彖傳凡五見或五應二或二應五師獨曰剛中謂二應謂六五應之以在師之時五之信任乎二尤不可不專也毒字如毒藥之攻病非有況痾堅癥不輕用也八百諸侯三千臣心皆欲伐紂則伐紂非武王諸侯王皆欲擊楚之弒義帝者則擊楚非高帝武王高帝特因衆心之正而用之以正彼之不正而已地中之濕者皆水田中之耕者皆兵水行乎地兵隱於農故取為象容民畜衆皆在無事之時於比得古人封建之法於師得古人井田之法初六才柔故有否臧之戒然以律不言吉否臧則言凶者律令謹嚴出師之常其勝負猶未可知故不言吉出而失律凶立見矣爻言王命象言天寵亦春秋王必稱天之意須知錫命又是寵任後屢致優典訟多私忿故上九訟勝而以三褫示其辱師多公義故九二師吉而以三錫彰其榮三為將者也師或輿尸不忍必言之五任將者也直書曰弟子輿尸謂五用二而又用三必至於如此禹之征苖啓之伐有扈胤之征羲和伐有罪必執言不但鳴條以後也田有禽利執言是師貞意長子帥師乃是本爻有此象是丈人意弟子輿尸乃假設之辭與家人嗃嗃繼以婦子嘻嘻同彖言師必用老成則既貞又吉爻言用老成而以新進參之雖貞亦凶一使字繫民命之生死國家之安危王三錫命命於行師之始大君有命命於行師之終懷邦亂邦大人小人之所以分弟子輿尸戒於師始小人勿用戒於師終始無弟子則終無小人間一有之或賞而不封或封而不任不任亦不用也師旅之興成功非一道不必皆君子小人平時易致驕盈况挾其功乎漢之英彭所以亡也初六出師而嚴其律九二帥師而得其人戒六三之輿尸而一其令審六四之左次而重其進去天下之害而不自為害奉天人之辭而不自為辭此皆六五之君得興師之道操任將之法至上六而功成治定師之道終焉然寵命有功非至正不為功登用人才非君子不為才致其憂於甚喜之後吝其用於博用之初然後功成而無後患六爻出師駐師將兵將將與奉辭伐罪旋師班賞無所不載雖後世兵書之繁不如師卦六爻之略初師之始故曰師出以律上師之終故曰開國承家師之次序然也四之無咎不如二之吉三之凶又不如四之無咎自卦辭至四之無咎皆恐懼重民之意比一陽之卦得位者師比而已得君位者為比得臣位者為師比所以次師者言衆雖聽命於將帥而心當親輔於君也蒙之筮問之人者也不一則不專比之筮問其在我者也不再則不審彖言五隂比一陽象言一陽比五隂以互相發比之義盡矣比之於人大矣故必筮而從事古人祭必筮尸冠必筮賔況比乎何莫不筮而獨言於比與蒙蒙言初尚誠也比言原尚豫也九五陽剛是天德中正即是天德之運為王道處原者依原如初之意原筮言必如初之勤而常自審察也後是不來此上下之親比非小人之朋比也上親下則下有歸下親上則上有與有歸則不離有與則不孤商以離德亡周以同心昌故曰比吉太公避紂以待文王曰吾聞其善養老馬援舍隴而歸漢曰當今非特君擇臣臣亦擇君故曰原筮元永貞無咎酈生説田橫以天下後服者先亡故曰後夫凶上下指五隂其在人事猶云羣后百姓耳上下是已比者不寧是未比者地上有水非澤所鍾散而會川各有所比公侯伯子男封疆有限建之也朝聘往來恩禮無間親之也萬國猶地也諸侯之得國猶水之居地也唐虞萬國周止千八百國者衆建而少其力也衆建則多助少其力則易制不曰萬國建后諸侯親王而曰王建萬國親諸侯蓋上之親下甚於下之親上禹貢既分天下為九州又分為五服分州為貢賦設建服為諸侯朝見設古以封建治天下分州以為經分服以為緯每州為二百一十國有方伯連帥以統之此其經也至其朝也則不論州而論服若各隨道里逺近為踈數之限因四方而分四時此其緯也經緯之紛錯所以相持而法難壞夏五服周六服周官九服彤弓雖列於一什之首其實為蓼蕭湛露之次天子於諸侯以朝會則歌蓼蕭以宴私則歌湛露以賞功則歌彤弓易言有孚者二十一有言信其如此者有言有孚誠者五為比主六二自內卦比之六四自外卦比之師比之五俱取禽象師之曰有禽害物之禽比之前禽背己之禽也在師則執之王者之義在比能失之王者之仁使邑人不諭上意有惟恐失之之心則禽無遺類其仁不廣矣師之使不當誰使之五也比之使中誰使之亦五也卦言其才則夫當順從而不可後爻言其變則首當統下而不可無其凶一也缶質器盈缶內充實而外無文誠之至也故餘耳之光初隙末則如勿光周鄭之信不由衷則如勿信物以相親而益亦以相親而賊故與離婁同楫罔不涉與師冕同轍罔不蹶仲尼蘭鮑荀卿蓬麻皆戒於親非其人也王者之比天下去妙巧捐䇿謀昭示之以至正大中之道而已可以比天下而不可以示天下王者不由也故曰顯比夫惟不取禽而禽自至故為天子之畋不誡人而人自親故為王者之比太王去邠而從之者如歸市則驅禽而禽不去成湯征葛而聞之者怨奚後則不令而捷於令有身無首有衆無主之象所謂比之言天下之民所比輔也無首言無君也比之自內如舜因堯之求而起自歷山以相堯伊尹因湯之聘而起自萃野以相湯傅説因高宗之求而起自巖穴以相高宗其身不出待聘者也外則其身出而杖䇿來從也三驅者立四表而三作三坐王者之田之法也周官詳矣以法從事而不必於得邑者居邑易中所言邑皆同王者所都諸侯國中也誡期約也待物之仁不期誡於居邑上之使之只是三驅失前禽之意有以化之耳非别有所以使之顯其比周而不比矣不顯其比比而不周矣小畜雲之為物散則霽密則雨今密而不雨自西故也雲自西則曷為不雨乾西北巽東南故也雲興乎西而風起乎東霍然散矣何雨之望大抵風從雲則隂陽和而雨雲避風則隂陽戾而暵韓退之訟風伯曰雲屏屏兮吹使漓之蓋天地之氣東北陽也西南隂也雲起東北乃陽倡而隂必和故有雨雲起西南乃隂倡而陽不和故無雨俗諺云雲往東一場空雲往西馬濺泥雲往南水潭潭雲往北只空黑是其驗也又驗之風電亦然小人雖以隂道柔術思欲係畜君子而君子為其所欺亦牽係之然未翕合附協而與之和譬則隂氣雖密而陽不與和猶未成雨如此則是為小人者徒自勞其思慮自用其謀術耳所謂畜未極施未行正卦中所藴小畜道理凡占得此者當毋為小人所終畜使小人得行其施可也畜係畜也言要結而制畜之也此小人用卑遜謙柔之術以要結衆君子欲將大家都牽係定了方制縛之而猶未能係得定制得倒者也故謂能係而不能固有止而畜之者畜之大有入而畜之者畜之小文王當紂之時左右憸人終不能自止其進以此知文王志在明夷而道在小畜小過六五爻辭與小畜彖辭同文王之意謂一隂畜乎五陽隂有所不及不能成雨周公之意謂四隂過乎二陽陽有所不及亦不能成雨隂不及不許小者之畜陽不及不許小者之過健者持守堅定終不為小人所誘巽者識見精密竟不為小人所欺剛指二五則九五亦作君子看乃君子之領袖者尚往陽也言陽升而隂不能固止之施未行隂也言隂未能畜陽降而成雨也曰剛中而志行曰施未行二行字相應陽被畜而志猶可行隂雖得位而施未可行尚往也在人事是小人雖用隂謀詭術係畜君子而其積纍未久係畜未極君子猶自上行未與小人和也施未行也在人事是小人之畜未極而君子猶自上行則其謀雖用而未效術雖勞而未售是小人之施未行也文德者德之見乎外著於容貌動靜顔色詞氣之間如天氣之下著也懿者逺暴慢去鄙悖必使極其懿美如風行天上盡畜止其痕翳而天氣極其清明也此君子亦是厚積逺施者但因小畜之象而尋出所以則其象者耳要之細行不矜終纍大德君子順德積小高大總大畜內事也卦言畜取止之義爻言復取進之義爻與卦不可一例觀在下而畜於隂勢也其不為所畜而復於上者理也復待於牽已不如初復之為易然牽而能復亦不為失也輻車轑也輹車軸轉也輻以利輪之轉輹以利軸之轉然輻無説理必輪破轂裂而後可説若輹則有説時車不行則説之矣大畜大壯皆作輹字九三反目稱妻言相敵也上九既雨稱婦言相順也輿説輻陽畜於隂而不得進也夫妻反目陽不平其畜而與之爭也卦辭言不雨未成畜也上九言既雨畜道成矣卦爻互辭以見意如履卦不嘻人亨爻言嘻人凶夫妻反目罪夫也斥陽而使之就中婦貞厲罪婦也斥隂而使之損過三剛不中而夫妻反目五剛得中而富以其鄰此卦六爻自五陽為一隂所畜而言則五陽為君子六四一隂為小人自四五畜下三爻而言則又以下三爻為強梁跋扈者流矣巽體三爻同力畜乾此乾字如唐諸藩鎮之類九五如唐憲宗四上二爻如裴度杜黃裳諸臣以此而畜衆陽斯皆在其所畜之中矣爻辭二句本相承説象傳挈而明之正以見有孚尤為本也爻辭尚德載主在君子尊尚其德者布滿也象德積載只主在小人身上説言其隂德要結人心已積纍至於布滿也履卦體以兌遇乾兌柔固主在柔善説乾剛非偏指剛惡言卦名且據履字為義猶未致重危機之意危機之意至文王虎尾之云方説出履同人艮中孚皆以卦名入彖辭省文也釋在其中矣履一隂居下卦之上夬一隂居上卦之上文象相類故五亦稱夬履者禮也又履不處也不處者行之謂也行天下而不禦者莫若禮凡有血氣者皆有爭心故天下之剛暴莫慘乎爭心而虎為下禮一行焉慢斯恭悖斯順爭斯遜矣若蹈虎尾而亦不噬人矣豈惟不噬又且亨焉大哉禮乎或問柔剛説乾四字何别曰柔剛且以各人本等性質言説乾則二人之所以相與者也柔履剛且據履字立意且虛言躡其後而進剛中正一條與上文釋卦辭無干卦中具有這段履底大義理故復舉而明之本義所謂又以卦體明之者乃明履之道非明亨之義也夫禮者所以定親踈決嫌疑别同異明是非也今辨上下定民志不言於上天下水之訟上天下地之否必言於上天下澤之履何也曰上天下地其分自遼絶又何必辨上天下水其行自相違亦不必辨惟上天下澤則有不可不辨者蓋澤以漫漶逺望則與天相連不知孰為天孰為澤所以觀此象以辨之澤如湖海之類聖人於疑似之間必致意焉故不曰天下有澤不曰澤在天下必曰上天下澤所以嚴大分也天高地下天尊地卑澤又下之下卑之卑者君子徐行後長者而民猶有紾其兄之臂君子不敢齒路馬而民猶有犯屬車之塵故辨上下者非私其上也安其上也非安其上也安其下也所謂以諸侯而請隧與繁纓者無有矣以大夫而僣八佾以市井而僣稱公者無有矣如後世之庶人帝服娼優后飾者益無有矣繫辭以易之興為文王與紂之事故其辭危履虎尾危之至矣而紂卒不能傷文王故履為九卦憂患之首初九素其位而行者也舜飯糗茹草若將終身顔子居於陋巷不改其樂其斯之謂歟獨專也若欲貴之心與行道之心交戰於中豈能安履其素哉無其素而欲行欺也不於其志而於其身汙也故古者學而後行後世行而後學顔子陋巷之禹稷仲舒下帷之伊呂孔明草廬之管樂不如是不為素履幽不是幽隱即是九二之履道坦坦是乃幽靜玄淡之人恬無嗜欲者然也明非多欲之人所能也居宗廟朝廷之上而不改簞瓢糗茹之氣在冠冕佩玉之列而不忘黃冠野服之心世之富貴得而亂之哉張良近之矣行不中則跛歸妹初九但曰跛不中也視不正則眇歸妹九二但曰眇不正也履六三一爻並書之者惡三不中且不正也眇自以為能視跛自以為能履猶武人而自以為能有為於天下位不當只是履乾蓋其所值之方非六三所利者也六三言虎尾以乾為虎九四言虎尾以君為虎彖言履帝位而不疚正指九五而言五爻辭乃曰夬履貞厲在下者不患其不憂患其不能樂故喜其履坦在上者不患其不樂患其不能憂故戒其夬履二之坦則正而吉喜之也五之夬雖正而危戒之也故去四凶非舜之剛而莫剛於班有苖之師伐胸奴非武帝之勇而莫勇於棄輪臺之地得此爻之戒矣小畜履上九皆不取本爻義小畜取畜之終履取履之終但小畜之終專從六四一隂説來故曰凶履之終統從諸爻説來故曰其旋元吉凡事善而或一事之未善一事中九分善或一分之未善皆非旋也皆非大善而吉也若只是半截時無由考得其祥後面半截却不好未可知旋是那團旋來却到那起頭處大有慶方是實説福初上履之終始也初言往上言旋彖與六三以一卦言也爻不與六三以一爻言也履主於行者也然初尚素履二尚幽貞勇於行而三凶懼於行而四吉五決於行則厲上反其初則慶然則履不處也而未嘗忘於處也泰否泰之彖歸宿在君子小人之消長故曰易以天道明人事內外釋往來之義隂陽健順君子小人釋大小之義信而任之則為內踈而逺之則為外內陽而外隂應天地交來內健而外順應上下交來內君子而外小人君子道長小人道消則又專就君子小人為言蓋小往大來本旨否泰二卦彖傳合名辭而釋之不分釋卦名釋卦辭者蓋內陽外隂內健外順內君子外小人固小往大來之義亦正所以為泰也天地交而萬物通上下交而其志同固泰之義亦正所以致小往大來義本相貫故彖傳合而釋之隂陽以氣言陽者天地之生氣隂者天地之殺氣也時則造化生生之仁布德和令而主歲功其摧折剝落之威固置諸空虛不用之處矣健順以德言夫健君德也順臣德也內健言內當為主者方剛毅果斷無少委靡之意外順言外當聽令者方恭謹忠順無敢凌犯之意君子者得隂陽正氣以生其令德足以為治者小人者得隂陽邪氣以生其凶德足以為亂者內君子外小人不是君子皆在朝小人皆在野內只是為主而用事外者退聽而已君子小人以人言道長道消以道言謂之外則猶有在位者但踈逺而不當事任耳謂之消則全滅息絶不行矣桑扈鴛鴦二詩天子諸侯同心一體以君子互稱則名勢相忘以福祿互禱則富貴相濟所以上下交而為泰天地之道何道也一言而盡曰交而已君民之情交故鰥寡達於旒纊君臣之志交故幽側發乎夢卜天人之心交故言行感乎日星大哉交之為道乎如堯典之厯象日月星辰以閏月定四時成歲禹貢之别九州則三壤皆裁成輔相以左右斯民之法左右即輔翼匡直之謂與益稷左右有民之左右同在天地則裁成之以制其過輔相之以補其不及在斯民則左右之以救其偏無非皆欲其中也初曰以其彚君子與君子為類三陽欲進而以之者在初四曰以其鄰小人與小人為類三隂欲復而以之者在四茅茹茅之根也彚類也一茅拔衆根隨一賢舉衆俊歸泰之初惟一陽首進則三陽類進矣堯舉一舜乃得十六舜舜舉一禹乃得九禹吉孰大焉致泰之道其綱一其目三何謂一曰包荒以宏其度何謂三曰用人之際不以全責備不以近忘逺不以羣間孤易曰用馮河詩曰不敢馮河何易之所取而詩之所戒耶徒勇於馮河者亡象勇於馮河者昌易詩之教互發而不相戾也彚征於初九則君子之黨盛朋亡於九二則小人之黨絶舉元凱誅四凶並行不悖也尚之為言配合也如西漢以列侯尚主之尚陽之平也已有陂之幾隂之往也已有復之幾况九三將過乎中其陂其復此天運之必至而有孚者也平陂往復者天運之不能無艱貞勿恤者人事之所當盡泰之時有何艱而言艱惟后克艱然後安厥后惟臣克艱然後安厥臣陽自上而下曰復小往大來也隂自上而下亦曰復大往小來也故曰無往不復居泰之世者勿謂時平其險將萌勿謂隂往其復反掌開元之末天寶之初其泰之九三乎夫人富而其類從者為利也不富而從者其志同也陽之進曰拔茅以自下而上升之難隂之返曰翩翩以自上而下復之易君子所當戒不待言矣屈之甚者伸必烈伏之久者飛必決故不待結之以富而其鄰從之者甚於從富不待戒之以令而其類信之者速於信令蕭傳隕而恭顯薦貢禹王章誅而欽永賀王氏九齡罷而林甫引仙客國忠其泰之六四乎九三之時猶可為也六四之時不可為也商之君以天干甲乙丙丁為次帝乙乃制王姬下嫁之禮者握隍土積纍以成城如治道積纍以成泰泰將反於否如城土頽圮復反於隍也城復於隍豈徒取象哉否泰相仍陵谷相變亦道其實耳否泰之君子以一身之亨亨天下否之君子以天下之正正一身文王就卦名為辭言時至於否匪人道矣所謂朝廷非朝廷世界非世界秦亡於李斯上書之日漢替於張禹談經之時咸陽之煨燼始皇之塗炭何必見而後悟哉泰曰健順否曰柔剛者蓋健順都是好字惟泰之時説得若否之時固即泰之反然曰內順外健則於字義不通矣故此曰柔剛言內當為主者反柔懦不振而外當順從者反強梁方盛蓋君弱臣強之時也伏羲名卦以乾上為君不下交坤下為臣不上交夫子發卦之藴則又以內外貞悔為主賔故內坤為內柔而朝廷根本之地方懦弱之象外乾為外剛而羣臣諸侯方強盛之象主德不斷亦隂柔也女謁通行亦隂柔也近習用事亦隂柔也儉德避難不與害交也不可榮以祿不與利交也此君子體天地不交之象不可榮不可得而榮非戒其不可也世固有假避禍之名以保榮祿者故必兼言之儉德坤之嗇也不可祿天之高也聞之漢玄儒婁先生碑云安貞守賤不可榮以祿蓋否而榮以祿邦無道而富貴也夬而不施祿去小人以為己利也泰之象言后道在上也否之象言君子道在下也時乎否也君子在下泰之時裁成輔相君子與有力焉今也不然是謂儉德嘗聞蘇子瞻云漸喜不為人所識意近之矣辟難可也何必儉德非能忍天下不可忍之窮不能辟天下不可辟之難彖言不利君子貞初乃言貞吉亨何也彖指在位君子顯而未退者爻指在野君子隱而不出者泰之初九君子難進故勉之以征否之初六小人進而為邪故戒之以貞居廟堂則憂其民處江湖則憂其君泰之志在外而否之志在君也一曰志在外一曰志在君語意相符不以治亂邪正為别者以否與泰並論則無不可為之時以君子小人並論則無不可化之人易雖不為小人謀而不能使小人之不占故開之以包承君子之路泰初九志在外本有是志也此志在君因貞吉乃能也否者儉德辟難之意包羞而未發倘其自以為可羞則亦羞恥之心義之端也故不言凶咎人無有不善所以包畜邪濫至可羞恥者豈其本心也特所處之位不當而已否九四有命即泰九三無往不復之義泰變為否易故於內卦即言之否變為泰難故於外卦始言之不可榮以祿為不在位者説若四之志行以居近君之位而任濟否之責者二五皆以大人言不能處否而亨其能休天下之否乎有命將濟之時休否可濟之時傾則否於此盡矣喜字又自其亡其亡戒懼中來古字儔與疇通洪範九疇之疇亦訓類離附麗也祉祿也否之九四其與泰之六四對乎六四以其鄰九四疇離祉夫以一隂字盡隂類而斥惡也周以一疇字該陽類而賞善也遍九五大君能用九四故曰休否復二下仁亦曰休復泰之三泰己改否之上否方傾深九仞而廢井遭一折而覆車初六小人之媒許史是已六二小人之魁石顯是已六三小人之朋鄭朋五鹿是已小人鋭於初壯於二窮於三羣小用事三斯盈盈斯窮矣九四一陽在外者將復進矣六三之勢安得不窮然君子見幾於未窮之先小人樂禍於已窮之後包羞忍恥以茍富貴而不去不知其位之不當而身之將危也思上蔡之犬悔華亭之鶴而後己馮異謂願陛下無忘在河北時小臣不敢忘巾車之恩郭崇韜謂無忘戰於河上之時當使煩暑生清涼得否九五上九之義矣其亡者勿恃其否之可休勿安其休之為言則休否之吉可以固如桑本而不拔矣蓋聖人願治之心愈切而思亂之心愈危光武日謹一日以十年為逺審黃石存苞桑所以能身濟大業延祚四百也不然如梁武帝唐莊宗身得天下身失天下休否可恃乎讀易紀聞卷一
